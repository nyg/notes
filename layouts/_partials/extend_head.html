{{ if hugo.IsProduction }}
{{/* Blockers drop third-party sendBeacon requests, so count.js sends its hits with fetch instead. */}}
<script>
  if (window.fetch) navigator.sendBeacon = function (url) {
    fetch(url, { method: 'POST', keepalive: true, mode: 'no-cors' }).catch(function () {})
    return true
  }
</script>
<script data-goatcounter="https://nyg-notes.cloudflare-mmdif.workers.dev/hit" async src="/count.js"></script>
{{ end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
