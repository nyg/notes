site_name: Notes
site_url: https://notes.andstuff.dev
site_author: nyg
site_description: Technical notes & articles written over the years

repo_name: nyg/notes
repo_url: https://github.com/nyg/notes

extra_javascript:
  - assets/js/timeago.min.js
  - assets/js/timeago_mkdocs_material.js

extra_css:
  - assets/css/custom.css

extra:
  analytics:
    provider: goatcounter

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - tags
  - glightbox:
      width: 90%
      auto_themed: true
      shadow: false
  - git-revision-date-localized:
      enable_creation_date: true
      type: custom
      custom_format: "%b %-d, ’%y"
      exclude:
        - index.md
        - tags.md

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    #- navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.follow
  palette:
    - scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: sans-serif
    code: monospace
  icon:
    logo: logo

nav:
  - Home:
    - index.md
    - tags.md
  - Programmation:
      - prog/apollo-graphql.md
      - prog/python-cheatsheet.md
