site_name: Notes
site_url: https://notes.andstuff.club
site_author: nyg
site_description: Technical notes & articles written over the years

repo_name: nyg/notes
repo_url: https://git.sr.ht/~nyg/notes

extra_css:
  - assets/custom.css

extra:
  analytics:
    provider: goatcounter

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  - tags:
      tags_file: tags.md
  - git-revision-date-localized:
      enable_creation_date: true
      type: custom
      custom_format: "%b %-d, ’%y"
      exclude:
        - index.md
        - tags.md

theme:
  name: material
  custom_dir: overrides
  language: custom
  features:
    #- navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: logo

nav:
  - Home:
    - Welcome: index.md
    - Tags: tags.md
  - Programmation:
      - Apollo GraphQL: prog/apollo-graphql.md
      - Python: prog/python-cheat-sheet.md
      - SageMath: prog/sagemath.md
      - Concurrency:
          - Résumé: prog/pco/summary.md
          - Exclusion mutuelle: prog/pco/1_exclusion_mutuelle.md
          - Threads: prog/pco/3_threads.md
          - Verrous & sémaphores: prog/pco/4_verrous_semaphores.md
          - Producteurs & consommateurs: prog/pco/5_producteurs_consommateurs.md
          - Moniteurs: prog/pco/6_moniteurs.md
          - Lecteurs & Rédacteurs: prog/pco/7_lecteurs_redacteurs.md
      - Network:
          - Java IO Streams: prog/res/java-io-streams.md
          - SMTP: prog/res/smtp.md
          - UDP: prog/res/udp.md
      - Web:
          - Résumé: prog/resume-tweb.md
  - Softwares:
